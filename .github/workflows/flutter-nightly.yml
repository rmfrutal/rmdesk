name: Flutter Nightly Build

on:
  # A montagem automática de toda madrugada foi desligada: aqui o instalador é
  # gerado quando a gente cria uma etiqueta de versão, e não todo dia.
  workflow_dispatch:

jobs:
  run-flutter-nightly-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"
